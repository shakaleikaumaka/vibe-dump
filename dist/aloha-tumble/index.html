<meta name="description" content="A mahalo fork of Jukugo Tumble. Kanji blocks tumble under a Komoro dusk, and the words that carry aloha answer in ʻŌlelo Hawaiʻi — the sea as kai, the wave as nalu, love as aloha.">

<body>
<div id="stage">
  <canvas id="floor"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="cards"></div>
</div>

<header id="title" class="plate">
  <h1><span class="ja">愛語</span><span class="en">Aloha Tumble</span></h1>
  <p>Two-character words with aloha folded in. Each block can turn over to another character — the sea answers as <i>kai</i>, the wave as <i>nalu</i>, and love, every time, as <i>aloha</i>.</p>
</header>

<aside id="legend" class="plate" aria-label="Legend">
  <div><i class="sw sw-pair"></i><span>shared character</span></div>
  <div><i class="sw sw-field"></i><span>semantic field</span></div>
  <div><i class="sw sw-note"></i><span>note</span></div>
</aside>

<footer id="stats" class="plate">
  <span><b id="st-turns">0000</b> turns</span>
  <span><b id="st-links">00</b> links</span>
  <span><b id="st-pairs">00</b> words</span>
  <span class="keys">drag · scroll · click a block · space · aloha</span>
</footer>

<div id="lele" aria-hidden="true">
  <span class="bf bf-1"></span>
  <span class="bf bf-2"></span>
  <span class="bf bf-3"></span>
